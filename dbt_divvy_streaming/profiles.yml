dbt_divvy_streaming:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      server: localhost
      port: 14330
      database: Bike_Streaming
      schema: dbo
      windows_login: true
      encrypt: true
      trust_cert: true
      threads: 1
    docker:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      server: "{{ env_var('SQLSERVER_HOST', 'sqlserver') }}"
      port: "{{ env_var('SQLSERVER_PORT', '1433') | as_number }}"
      database: Bike_Streaming
      schema: dbo
      user: "{{ env_var('DBT_USER', 'divvy_dbt') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      encrypt: true
      trust_cert: true
      threads: 1