services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: divvy-kafka
    ports:
      - "9092:9092"          # for apps running on your machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic divvy_stations --partitions 1 --replication-factor 1
    restart: "no"

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: divvy-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./config:/app/config:ro
    mem_limit: 128m
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: divvy-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: 2048
    ports:
      - "14331:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    mem_limit: 3g
    restart: unless-stopped

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      - sqlserver
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      DBT_PASSWORD: ${DBT_PASSWORD:?DBT_PASSWORD is not set in .env}
      BI_PASSWORD: ${BI_PASSWORD:?BI_PASSWORD is not set in .env}
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1 && break
          echo "waiting for SQL Server..."; sleep 5
        done
        /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$SA_PASSWORD" -b -i /sql/init_db.sql
        /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$SA_PASSWORD" -b -v DBT_PASSWORD="$$DBT_PASSWORD" -i /sql/create_dbt_login.sql
        /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$SA_PASSWORD" -b -v BI_PASSWORD="$$BI_PASSWORD" -i /sql/create_bi_login.sql
    restart: "no"

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: divvy-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: "1433"
      SQLSERVER_USER: divvy_app
      SQLSERVER_PASSWORD: ${APP_PASSWORD}
      CHECKPOINT_DIR: /checkpoints/divvy_bronze
      STARTING_OFFSETS: earliest
    volumes:
      - ./config:/app/config:ro
      - spark_checkpoints:/checkpoints
      - ivy_cache:/root/.ivy2
    mem_limit: 2g
    restart: unless-stopped

  dbt:
    build:
      context: .
      dockerfile: dbt_divvy_streaming/Dockerfile
    container_name: divvy-dbt
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: "1433"
      DBT_USER: divvy_dbt
      DBT_PASSWORD: ${DBT_PASSWORD}
      DBT_INTERVAL_SECONDS: "60"
    mem_limit: 512m
    restart: unless-stopped
      
volumes:
  kafka_data:
  sqlserver_data:
  spark_checkpoints:
  ivy_cache: